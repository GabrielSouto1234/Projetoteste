<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadros de Pedidos - Lixas Tatu</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="menu.css">
  
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
    }
    .modal.show {
      display: flex !important;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1f2937;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      color: white;
    }
    .timeline-item { position: relative; padding-left: 30px; margin-bottom: 20px; }
    .timeline-item::before { content: ''; position: absolute; left: 15px; top: 0; bottom: -20px; width: 2px; background: #4a5568; }
    .timeline-item:last-child::before { bottom: 0; }
    .timeline-dot { position: absolute; left: 8px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #4a90e2; }
    .status-badge { position: absolute; top: -10px; right: -10px; padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    
    /* ✅ BOTÕES BEM DISTRIBUÍDOS */
    .btns-container {
      display: flex !important;
      justify-content: space-evenly !important;
      align-items: center !important;
      gap: 1.5rem !important;
      padding: 1rem 0 !important;
      width: 100% !important;
      max-width: 320px !important;
      margin: 2rem auto 0 !important;
    }
    .btn-compact {
      width: 56px !important;
      height: 56px !important;
      border-radius: 16px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: all 0.3s ease !important;
      border: none !important;
      cursor: pointer !important;
      font-size: 20px !important;
      flex-shrink: 0 !important;
    }
    .btn-data { background: linear-gradient(135deg, #3b82f6, #2563eb) !important; color: white !important; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3) !important; }
    .btn-data:hover { transform: scale(1.1) !important; box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4) !important; }
    .btn-prosseguir { background: linear-gradient(135deg, #10b981, #059669) !important; color: white !important; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3) !important; }
    .btn-prosseguir:hover { transform: scale(1.1) !important; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4) !important; }
    .btn-obs { background: linear-gradient(135deg, #f59e0b, #d97706) !important; color: white !important; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3) !important; }
    .btn-obs:hover { transform: scale(1.1) !important; box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4) !important; }
    .btn-cancelar { background: linear-gradient(135deg, #ef4444, #dc2626) !important; color: white !important; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3) !important; }
    .btn-cancelar:hover { transform: scale(1.1) !important; box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4) !important; }
    
    /* ✅ BOTÃO PARTICULAS */
    .btn-particles {
      position: relative !important;
      transition: all 0.3s ease !important;
    }
    .btn-particles.active {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed) !important;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4) !important;
      animation: pulse 2s infinite !important;
    }
    .btn-particles:hover { transform: scale(1.1) !important; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    /* ✅ CONTAGEM ANIMADA BONITA */
    .pedido-count {
      display: inline-block !important;
      font-size: 2.5rem !important;
      font-weight: bold !important;
      background: linear-gradient(135deg, #60a5fa, #3b82f6) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      animation: countUp 0.8s ease-out !important;
      min-width: 2.5rem !important;
      text-align: center !important;
    }
    @keyframes countUp {
      from { opacity: 0; transform: translateY(20px) scale(0.8); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .count-box {
      position: relative !important;
      overflow: hidden !important;
    }
    .count-box::after {
      content: '' !important;
      position: absolute !important;
      top: 0 !important;
      left: -100% !important;
      width: 100% !important;
      height: 100% !important;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent) !important;
      animation: shimmer 2s infinite !important;
    }
    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    
    /* ✅ PARTICULAS VISÍVEIS/INVISÍVEIS */
    #particles-js { 
      position: fixed !important; 
      top: 0 !important; 
      left: 0 !important; 
      width: 100% !important; 
      height: 100% !important; 
      z-index: -1 !important; 
      opacity: 0 !important; 
      transition: opacity 0.5s ease !important;
    }
    #particles-js.active { opacity: 1 !important; }
    
    .container { overflow-x: hidden !important; }
    .card { min-width: 0; flex: 1 1 0; }
  </style>
</head>
<body class="dark flex bg-gray-900 text-white">
  <!-- ✅ PARTICULAS DE FUNDO -->
  <div id="particles-js"></div>
  
  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 h-screen px-3 py-4 overflow-y-auto text-white transform transition-transform duration-300 ease-in-out -translate-x-full z-50 bg-gray-800" aria-label="Sidebar">
    <div class="flex justify-between items-center mb-5">
      <a href="#" class="flex items-center ps-2.5">
        <img src="logotatu.png" class="h-6 me-3 sm:h-7" alt="Logo Tatu">
        <span class="self-center text-xl font-semibold whitespace-nowrap">Relatórios</span>
      </a>
      <button id="closeSidebarBtn" class="text-white text-2xl font-bold md:hidden">×</button>
    </div>
    <nav class="mt-6 space-y-3">
      <a href="Relatoriopedido.html" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition w-full">
        <svg class="w-5 h-5 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 21">
          <path d="M16.975 11H10V4.025a1 1 0 0 0-1.066-.998 8.5 8.5 0 1 0 9.039 9.039.999.999 0 0 0-1-1.066h.002Z"></path>
          <path d="M12.5 0c-.157 0-.311.01-.565.027A1 1 0 0 0 11 1.02V10h8.975a1 1 0 0 0 1-.935c.013-.188.028-.374.028-.565A8.51 8.51 0 0 0 12.5 0Z"></path>
        </svg>
        Relatório
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="flex-1 min-h-screen">
    <!-- TOP BAR -->
    <nav class="top-bar fixed inset-x-0 top-0 h-20 flex items-center justify-between px-6 z-40 bg-gray-800 bg-opacity-95 shadow-lg">
      <div class="flex items-center gap-4">
        <button id="toggleSidebarBtn" class="text-white text-2xl font-bold md:block hidden">☰</button>
        <a href="Relatoriopedido.html" class="flex items-center bg-gradient-to-r from-blue-500 to-blue-400 text-white px-6 py-2 rounded-lg font-semibold hover:from-blue-600 hover:to-blue-500 transition-all duration-200 transform hover:-translate-y-1 shadow-lg">
          <svg class="w-5 h-5 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"></path>
          </svg>
          Relatório
        </a>
        <button id="toggleThemeBtn" class="text-white p-2 rounded-full hover:bg-gray-700">🌙</button>
        <button id="toggleParticlesBtn" class="btn-particles text-white p-2 rounded-full hover:bg-gray-700">✨</button>
        <button id="deleteAllBtn" class="text-white p-2 rounded-full hover:bg-gray-700">🗑️</button>
      </div>
      <div class="flex items-center gap-4">
        <div class="count-box cd bg-blue-500 px-3 py-1 rounded-full">
          <span id="cdCount">0</span> CD
        </div>
        <div class="count-box placa bg-orange-500 px-3 py-1 rounded-full">
          <span id="placaCount">0</span> Placa
        </div>
        <div class="count-box expedido bg-green-500 px-3 py-1 rounded-full">
          <span id="expedidoCount">0</span> Expedido
        </div>
      </div>
    </nav>

    <div class="w-full h-0.5 bg-gray-700 my-4 mt-24 opacity-50"></div>

    <!-- 4 CARDS COM CONTAGEM ANIMADA -->
    <div class="container flex flex-row flex-nowrap justify-between gap-4 w-full px-4 mx-auto pb-12">
      
      <!-- RECEBIDO -->
      <div class="card rounded-xl p-4 text-white bg-gray-800 custom-shadow flex-1 min-w-0">
        <div class="text-center">
          <span id="recebidoCount" class="pedido-count">0</span>
        </div>
        <h2 class="text-lg font-bold mb-3 text-center">Recebido no CD</h2>
        <div class="relative">
          <input type="text" id="searchRecebido" placeholder="Pesquisar..." class="w-full p-2 rounded-lg border border-gray-600 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-700 text-sm">
          <button id="insertPedidoBtn" class="absolute top-2 right-2 bg-green-500 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-green-600 transition-all shadow-lg">+</button>
        </div>
        <div id="recebidoList" class="mt-3 space-y-2 overflow-y-auto max-h-96"></div>
      </div>

      <!-- PLACA -->
      <div class="card rounded-xl p-4 text-white bg-gray-800 custom-shadow flex-1 min-w-0">
        <div class="text-center">
          <span id="placaCardCount" class="pedido-count">0</span>
        </div>
        <h2 class="text-lg font-bold mb-3 text-center">Pedido com Placa</h2>
        <div class="relative">
          <input type="text" id="searchPlaca" placeholder="Pesquisar..." class="w-full p-2 rounded-lg border border-gray-600 focus:ring-2 focus:ring-orange-500 focus:outline-none bg-gray-700 text-sm">
        </div>
        <div id="placaList" class="mt-3 space-y-2 overflow-y-auto max-h-96"></div>
      </div>

      <!-- SEPARADO -->
      <div class="card rounded-xl p-4 text-white bg-gray-800 custom-shadow flex-1 min-w-0">
        <div class="text-center">
          <span id="separadoCount" class="pedido-count">0</span>
        </div>
        <h2 class="text-lg font-bold mb-3 text-center">Pedidos Separado</h2>
        <input type="text" id="searchSeparado" placeholder="Pesquisar..." class="w-full p-2 rounded-lg border border-gray-600 focus:ring-2 focus:ring-green-500 focus:outline-none bg-gray-700 mb-3 text-sm">
        <div id="separadoList" class="mt-3 space-y-2 overflow-y-auto max-h-96"></div>
      </div>

      <!-- EXPEDIDO -->
      <div class="card rounded-xl p-4 text-white bg-gray-800 custom-shadow flex-1 min-w-0">
        <div class="text-center">
          <span id="expedidoCardCount" class="pedido-count">0</span>
        </div>
        <h2 class="text-lg font-bold mb-3 text-center">Pedidos Expedido</h2>
        <input type="text" id="searchExpedido" placeholder="Pesquisar..." class="w-full p-2 rounded-lg border border-gray-600 focus:ring-2 focus:ring-purple-500 focus:outline-none bg-gray-700 mb-3 text-sm">
        <div id="expedidoList" class="mt-3 space-y-2 overflow-y-auto max-h-96"></div>
      </div>
    </div>

    <!-- MODAL LOGIN -->
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close" id="closeLoginModal">&times;</span>
        <h2 class="text-xl font-bold mb-4">Login</h2>
        <input id="loginUser" placeholder="Usuário" class="w-full p-3 mb-3 rounded border bg-gray-700" />
        <input id="loginPass" type="password" placeholder="Senha" class="w-full p-3 mb-3 rounded border bg-gray-700" />
        <button id="loginButton" class="w-full bg-blue-500 text-white p-3 rounded hover:bg-blue-600">Entrar</button>
      </div>
    </div>

    <!-- ✅ MODAL INSERIR PEDIDO - SEM ALERTS -->
    <div id="inserirPedidoModal" class="modal">
      <div class="modal-content">
        <span class="close" id="closeInserirModal">&times;</span>
        <h2 class="text-xl font-bold mb-4">Inserir Pedido</h2>
        <input id="numeroPedido" placeholder="Número" class="w-full p-3 mb-3 rounded border bg-gray-700" maxlength="5"/>
        <input id="seriePedido" placeholder="Série" class="w-full p-3 mb-3 rounded border bg-gray-700" maxlength="1"/>
        <input id="nomeCliente" placeholder="Cliente" class="w-full p-3 mb-3 rounded border bg-gray-700" />
        <input id="dataChegada" type="date" class="w-full p-3 mb-3 rounded border bg-gray-700" />
        <div class="mb-3">
          <label class="block mb-2"><input id="tatuFlag" type="radio" name="flag" class="mr-2"> Tatu</label>
          <label><input id="gkFlag" type="radio" name="flag" class="mr-2"> GK</label>
        </div>
        <button id="addPedidoBtn" class="w-full bg-green-500 text-white p-3 rounded hover:bg-green-600">Adicionar</button>
        <div class="mt-4">
          <label class="cursor-pointer inline-flex items-center justify-center w-full px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded shadow">
            📁 Upload XML (SELECIONAR E FECHAR)
            <input type="file" id="xmlFileInput" accept=".xml" class="hidden" multiple>
          </label>
        </div>
      </div>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-window" class="fixed bottom-4 right-4 w-80 h-96 bg-white dark:bg-gray-800 rounded-lg shadow-lg hidden z-50 border">
      <div class="flex justify-between p-3 border-b dark:border-gray-600">
        <h3 class="text-blue-500 font-bold">Tatu AI</h3>
        <span id="chatbot-close" class="cursor-pointer text-xl hover:text-red-500">&times;</span>
      </div>
      <div id="chatbot-messages" class="p-3 h-64 overflow-y-auto bg-gray-50 dark:bg-gray-900 text-black dark:text-white"></div>
      <div class="p-3 flex">
        <input id="chatbot-input" class="flex-1 p-2 border rounded-l dark:bg-gray-700" placeholder="Digite sua mensagem...">
        <button id="chatbot-send" class="bg-blue-500 text-white px-4 rounded-r hover:bg-blue-600">▶</button>
      </div>
    </div>
    <button id="chatbot-button" class="fixed bottom-4 right-16 w-12 h-12 bg-blue-500 text-white rounded-full shadow-lg z-40 hover:bg-blue-600 transition">💬</button>

  </div>

  <!-- MODAL DETALHES PEDIDO -->
  <div id="detalhesPedidoModal" class="modal">
    <div class="modal-content max-w-4xl max-h-[95vh] overflow-y-auto">
      <div id="detalhesPedidoContent">
        <!-- CONTEÚDO CARREGA AQUI -->
      </div>
    </div>
  </div>

  <!-- MODAL APAGAR TODOS PEDIDOS -->
  <div id="deleteModal" class="modal">
    <div class="modal-content bg-gradient-to-br from-gray-800 to-gray-900 rounded-xl shadow-2xl p-6 max-w-md mx-auto">
      <div id="deleteModalContent">
        <!-- CONTEÚDO DINÂMICO AQUI -->
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="menu.js"></script>
</body>
</html>
